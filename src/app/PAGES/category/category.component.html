<app-header></app-header>
<div class="container-fluid" style="margin-bottom: 20px;     background-color: #e2e7e6e2;
">
<!-- <h1>{{data.ca}}</h1> -->
        <div class="row" >
            <div class="col-md-2 mt-3" *ngFor="let item of productdetails">
                <div class="card mt-2">
                    <div class="card-body"style="cursor: pointer;">
                        <div class="card-img-actions" >
                            <img routerLink="/product-detail/{{item.id}}" src="{{item.thumbnail}}" class="card-img-top img-fluid">
                        </div>
                    </div>

                    <div class="card-body bg-light text-center" style="min-height: 240px;">
                        <div>
                            <h6 routerLink="/product-detail/{{item.id}}" class="fw-bold" style="font-size: 14px;cursor: pointer;text-decoration:none">
                                <a class="text-dark" style="text-decoration:none">{{item.title}}</a>
                            </h6>
                        </div>
                        <h3 routerLink="/product-detail/{{item.id}}" class="mb-0 font-weight-semibold" style="cursor: pointer;">$ {{item.price}}</h3>
                        <div class="discount" style="display: flex;">
                            <h3 routerLink="/product-detail/{{item.id}}" class="mb-0 font-weight-normal">{{item.discountPercentage}}%</h3>
                            <h3 routerLink="/product-detail/{{item.id}}" class="mb-0 fw-semibold" style="color: rgb(189, 21, 21) ; font-size: 11px; margin-left: 14px;">Limited Time Deal</h3>
                        </div>
                        <!-- <button routerLink="/product-detail/{{item.id}}" class="btn btn-sm btn-dark mt-2"><i class="fa fa-solid fa-info mr-2"></i>&nbsp;&nbsp;View Details</button> -->
                        <button (click)="addcart(item)" class="btn btn-sm btn-warning mt-2"><i class="fa fa-shopping-cart mr-2"></i>&nbsp;Add to Cart</button>
                        <!-- <button (click)="removeitem(item)" class="btn btn-sm btn-danger mt-2"><i class="fa fa-shopping-remove mr-2"></i>&nbsp;Remove item</button> -->

                    </div>
                </div>
            </div>
        </div>
    </div>
    <app-footer></app-footer>
