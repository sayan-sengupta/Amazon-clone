<div class="d-flex flex-row justify-content-center">
  <div class="row">
    <div class="col-md">
      <img
        class="img_1"
        src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg"
        alt="Amazon Logo"
      />
    </div>
  </div>
</div>
<div class="wrapper">
  <h2>Sign Up</h2>
  <form (ngSubmit)="onSignUp()" #signupForm="ngForm">
    <div class="input-box">
      <input type="text" placeholder="Enter your username" required [(ngModel)]="signupObj.userName" name="username" >
    </div>
    <div class="input-box">
      <input type="text" placeholder="Enter your email" required [(ngModel)]="signupObj.email" name="email" #email="ngModel">
      <div *ngIf="email.invalid && (email.dirty || email.touched)" class="text-danger">
        <div *ngIf="email.errors?.required">Email is required.</div>
        <div *ngIf="email.errors?.email">Please enter a valid email.</div>
      </div>
    </div>
    <div class="input-box">
      <input type="password" placeholder="Create password" required [(ngModel)]="signupObj.password" name="pass">
    </div>
    <!-- <div class="input-box">
      <input type="password" placeholder="Confirm password" required [(ngModel)]="signObj.password">
    </div> -->
    <!-- <div class="policy">
      <input type="checkbox" />
      <h3>I accept all terms & condition</h3>
    </div> -->
    <div class="input-box button">
      <button type="submit" class="sign-up-button" [disabled]="signupForm.invalid">Sign Up</button>
    </div>
    <div class="text">
      <h3>Already have an account? <a routerLink="/login">Login now</a></h3>
    </div>
    <img
                id="amazon-img"
                src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg"
                alt="Amazon Image"
     />
  </form>
</div>

<div class="d-flex flex-row justify-content-center footer_1">
     <div class="row">
       <div class="col">
         <p class="conditions">
           <a>Conditions of Use &nbsp; &nbsp; &nbsp;</a
           ><a>Privacy Notice &nbsp; &nbsp; &nbsp; </a>
           <a>Help &nbsp; &nbsp; &nbsp; </a>
         </p>
       </div>
     </div>
   </div>
