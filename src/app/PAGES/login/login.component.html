<div>
  <div class="d-flex flex-row justify-content-center">
    <div class="row">
      <div class="col-md">
        <img
          class="img_1"
          src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg"
          alt="Amazon Logo"
        />
      </div>
    </div>
  </div>

  <div class="d-flex flex-row justify-content-center">
    <div class="row">
      <div class="col-md">
        <form #login="ngForm" (ngSubmit)="userLogin(login.value)">
          <div class="sign-in">Log in</div>
          <div class="form-group">
            <label id="words_1" for="exampleInputEmail1"
              >Email(phone for mobile accounts)</label
            >
            <input
              type="email"
              required
              class="form-control"
              id="exampleInputEmail1"
              aria-describedby="emailHelp"
              placeholder="Enter email"
              ngModel
              name="email"
            />
            <small id="emailHelp" class="form-text text-muted"></small>
          </div>
          <div class="form-group">
            <label id="words_2" for="exampleInputPassword1" required
              >Password
            </label>
            <input
              type="password"
              class="form-control"
              id="exampleInputPassword1"
              placeholder="Password"
              required
              ngModel
              name="pass"
            />

            <div class="form-group">
              <button type="submit" class="btn btn-warning" id="sign-in" >Sign in</button>
              <input
                type="checkbox"
                class="form-check-input checkbox"
                id="exampleCheck1"
              />
              <p class="keep-sign-in">
                Keep me signed in. <a href="https://stupidlink.com">Details</a>
              </p>
              <img
                id="amazon-img"
                src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg"
                alt="Amazon Image"
              />
            </div>
          </div>

          <button
            routerLink="/register"
            type="button"
            class="btn btn-warning"
            id="grey-button"
          >
            Create your Amazon account
          </button>

          <!-- <div
            id="g_id_onload"
            data-client_id="23003612651-2rovdmm61tie92qgnio5hm5v8ir6ctng.apps.googleusercontent.com"
            data-context="signin"
            data-ux_mode="popup"
            data-login_uri="http://localhost:5000/api/login"
            data-auto_select="true"
            data-itp_support="true"
          ></div>

          <div
            class="g_id_signin"
            data-type="standard"
            data-shape="pill"
            data-theme="filled_blue"
            data-text="signin_with"
            data-size="large"
            data-logo_alignment="left"
          ></div> -->
        </form>
      </div>
    </div>
  </div>

  <div class="d-flex flex-row justify-content-center footer_1">
    <div class="row">
      <div class="col">
        <p class="conditions">
          <a>Conditions of Use &nbsp; &nbsp; &nbsp;</a
          ><a>Privacy Notice &nbsp; &nbsp; &nbsp; </a>
          <a>Help &nbsp; &nbsp; &nbsp; </a>
        </p>
      </div>
    </div>
  </div>
</div>
